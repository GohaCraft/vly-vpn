    <path d="M 152 124 L 182 86" fill="none" stroke="#FFAA60" stroke-width="9" stroke-linecap="round" style="fill:none;stroke:rgb(255, 170, 96);color:rgb(255, 255, 255);stroke-width:9px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <path d="M 152 124 L 182 102" fill="none" stroke="#FFAA60" stroke-width="7" stroke-linecap="round" style="fill:none;stroke:rgb(255, 170, 96);color:rgb(255, 255, 255);stroke-width:7px;stroke-linecap:round;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
