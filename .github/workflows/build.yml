name: Build Aura VPN APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.2'
          channel: 'stable'

      - name: Fix Gradle version
        run: |
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip\n' > android/gradle/wrapper/gradle-wrapper.properties

      - name: Fix Gradle memory
        run: |
          printf 'org.gradle.jvmargs=-Xmx4g -Xms512m -XX:+UseG1GC -Dfile.encoding=UTF-8\nkotlin.daemon.jvm.options=-Xmx2g -Xms256m\norg.gradle.parallel=true\norg.gradle.caching=true\nandroid.useAndroidX=true\nandroid.enableJetifier=false\n' > android/gradle.properties

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK debug
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-vpn-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
