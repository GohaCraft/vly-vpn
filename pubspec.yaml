name: vpn_new
description: "Vly — Smart bypass, always on"
publish_to: 'none'
version: 6.2.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_v2ray: 1.0.10
  http: ^1.2.2
  shared_preferences: ^2.3.2
  mobile_scanner: ^5.2.3
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  # Android adaptive icon
  android: true
  image_path: "assets/images/aura_icon.png"
  adaptive_icon_background: "#1F0B0F"   # тёмный фон как bgDark скина Midnight
  adaptive_icon_foreground: "assets/images/aura_icon.png"
  min_sdk_android: 24
  # iOS
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/aura_icon.png
    - assets/images/aura_logo.png
